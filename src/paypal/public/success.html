<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment complete</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#6b6b6b; --line:#e6e6e6; --bg:#f7f7f5; --card:#fff; --ok:#1d7a4f; --bad:#b42318; }
    body { margin:0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
    main { max-width: 440px; margin: 40px auto; padding: 0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; text-align:center; }
    .mark { width:52px; height:52px; border-radius:50%; background:var(--ok); color:#fff; font-size:28px; line-height:52px; margin:0 auto 14px; }
    .mark.bad { background: var(--bad); }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0; font-size: 15px; }
    code { font-size: 13px; background: var(--bg); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" id="mark">✓</div>
    <h1 id="title">Payment complete</h1>
    <p id="msg">Thank you — we've received your payment.</p>
    <p style="margin-top:14px" id="ids"></p>
  </div>
</main>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const order = q.get("order");
  const ids = document.getElementById("ids");
  if (q.get("kind") === "donation") {
    document.getElementById("title").textContent = "Thank you for your donation";
    document.getElementById("msg").textContent = "Your donation has been received. PayPal will email you a receipt.";
  }

  // Redirect-flow landing: PayPal sent the buyer back with ?token=<order>; capture now.
  if (q.get("capture") === "1" && order) {
    const r = await fetch(`__BASE__/api/orders/${encodeURIComponent(order)}/capture`, { method: "POST" });
    const j = await r.json();
    if (j.status !== "COMPLETED") {
      document.getElementById("mark").textContent = "!";
      document.getElementById("mark").className = "mark bad";
      document.getElementById("title").textContent = "Payment not completed";
      document.getElementById("msg").textContent = j.recoverable
        ? "This checkout session expired before payment was confirmed. Please return to the store and try again."
        : "We couldn't confirm this payment. Please return to the store and try again.";
      return;
    }
    ids.innerHTML = `Reference <code>${j.captureId || order}</code>`;
    return;
  }
  if (q.get("pending") === "1") {
    document.getElementById("title").textContent = "Payment received — being confirmed";
    document.getElementById("msg").textContent = "PayPal is holding this payment for review. You'll get an email from PayPal when it clears; no action is needed from you.";
  }
  if (order) ids.innerHTML = `Reference <code>${q.get("capture") || order}</code>`;
})();
</script>
</body>
</html>
